# Render blueprint for Sequencer MVP 1.
# PostgreSQL is required. Uploaded workbooks use Django's storage API.
# The disk below keeps uploads across deploys; the database remains the audit record
# if a disk is not attached. See README, "Known MVP limitations".

services:
  - type: web
    name: sequencer
    runtime: python
    plan: starter
    buildCommand: "./build.sh"
    startCommand: "gunicorn sequencer.wsgi:application --bind 0.0.0.0:$PORT --timeout 180 --workers 2"
    healthCheckPath: /accounts/login/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DJANGO_SETTINGS_MODULE
        value: sequencer.settings.production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: SECURE_SSL_REDIRECT
        value: "true"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DATABASE_URL
        fromDatabase:
          name: sequencer-db
          property: connectionString
      - key: MEDIA_ROOT
        value: /var/data/media
    disk:
      name: sequencer-data
      mountPath: /var/data
      sizeGB: 1

databases:
  - name: sequencer-db
    plan: basic-256mb
    postgresMajorVersion: "16"
