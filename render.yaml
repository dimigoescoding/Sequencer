# Render Free plan.
# One web service (512 MB, 0.1 CPU) and one Postgres database (1 GB, expires after 30 days).
# Free web services cannot attach a disk and lose local files whenever they sleep.
# Original workbooks are stored in Postgres. Do not add a second free service:
# a workspace receives 750 free instance hours per month.

services:
  - type: web
    name: sequencer
    runtime: python
    # Resting plan. The app can move this service to 1c-2g for one run, then return it here.
    plan: free
    buildCommand: "./build.sh"
    startCommand: "./start.sh"
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DJANGO_SETTINGS_MODULE
        value: sequencer.settings.production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: SECURE_SSL_REDIRECT
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: sequencer-db
          property: connectionString
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: RENDER_API_KEY
        sync: false

databases:
  - name: sequencer-db
    plan: free
    postgresMajorVersion: "16"
