{% for field in form %}
  <div class="mb-3" {% if field.name == 'severity' %}id="severity-field"{% endif %} {% if field.name == 'value' %}id="value-field"{% endif %} {% if field.name == 'value_to' %}id="value-to-field"{% endif %} {% if field.name == 'foundation_id' or field.name == 'attribute' or field.name == 'operator' %}{% endif %}>
    {% if field.field.widget.input_type == 'checkbox' %}
      <div class="form-check">
        {{ field }}
        <label class="form-check-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
      </div>
    {% else %}
      <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
    {% endif %}
    {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
    {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
  </div>
{% endfor %}
